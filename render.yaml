services:
  - type: web
    name: trackcal-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node bot/index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BOT_PAUSED
        value: "true"
      - key: TRACKCAL_SYNC_CODE
        value: bharath-bulking-70kg
